{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inventory.fullname" . }}-frontend-config
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
    component: frontend
data:
  nginx.conf: |
    log_format inventory_access escape=json
      '{"type":"access","timestamp":"$time_iso8601","method":"$request_method",'
      '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
      '"duration_seconds":$request_time,"remote_address":"$remote_addr"}';

    server {
      listen 5174;
      server_name _;
      access_log /dev/stdout inventory_access;
      error_log /dev/stderr warn;
      
      # Frontend static files
      location / {
        try_files $uri $uri/ /index.html;
        root /usr/share/nginx/html;
      }
      
      # API proxy to backend
      location /api/ {
        proxy_pass http://{{ include "inventory.fullname" . }}-backend:{{ .Values.backend.service.port }}/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
{{- end }}
