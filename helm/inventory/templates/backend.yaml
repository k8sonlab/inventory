---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inventory.fullname" . }}-backend
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
    component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "inventory.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      labels:
        {{- include "inventory.selectorLabels" . | nindent 8 }}
        component: backend
    spec:
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        {{- with .Values.backend.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.backend.service.targetPort }}
          protocol: TCP
        env:
        {{- with .Values.backend.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: DATABASE_PATH
          value: {{ .Values.backend.database.path }}
        resources:
          {{- toYaml .Values.backend.resources | nindent 12 }}
        {{- if .Values.healthCheck.backend.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.healthCheck.backend.path }}
            port: http
          initialDelaySeconds: {{ .Values.healthCheck.backend.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthCheck.backend.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.healthCheck.backend.readinessPath }}
            port: http
          timeoutSeconds: {{ .Values.healthCheck.backend.readinessTimeoutSeconds }}
          initialDelaySeconds: {{ .Values.healthCheck.backend.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthCheck.backend.periodSeconds }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "inventory.fullname" . }}-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inventory.fullname" . }}-backend
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
    component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "inventory.selectorLabels" . | nindent 4 }}
    component: backend
