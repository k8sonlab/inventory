{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "inventory.fullname" . }}-frontend
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
  - {{ .Values.httpRoute.hostname | quote }}
  rules:
  # Frontend routes
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "inventory.fullname" . }}-frontend
      port: {{ .Values.frontend.service.port }}
      weight: 100
{{- end }}
