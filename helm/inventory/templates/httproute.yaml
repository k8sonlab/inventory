{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "inventory.fullname" . }}-frontend
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.httpRoute.gatewayName }}
    namespace: {{ .Release.Namespace }}
  hostnames:
  - {{ .Values.httpRoute.hostname | quote }}
  rules:
  # Frontend routes
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "inventory.fullname" . }}-frontend
      port: {{ .Values.frontend.service.port }}
      weight: 100
---
# Backend routing through frontend proxy (optional - for API calls)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inventory.fullname" . }}-frontend-config
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
data:
  nginx.conf: |
    server {
      listen 5174;
      server_name _;
      
      # Frontend static files
      location / {
        try_files $uri $uri/ /index.html;
        root /usr/share/nginx/html;
      }
      
      # API proxy to backend
      location /api/ {
        proxy_pass http://{{ include "inventory.fullname" . }}-backend:{{ .Values.backend.service.port }}/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
{{- end }}
