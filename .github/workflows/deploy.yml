name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - 'helm/**'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ["Build and Push Backend Image", "Build and Push Frontend Image"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Log in to Container Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Deploy with Helm (from GHCR)
        run: |
          helm upgrade --install inventory oci://ghcr.io/${{ github.repository }}/inventory \
            --namespace inventory \
            --create-namespace \
            --set frontend.image.tag=${{ github.sha }} \
            --set backend.image.tag=${{ github.sha }}

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/inventory-frontend -n inventory --timeout=5m
          kubectl rollout status deployment/inventory-backend -n inventory --timeout=5m

      - name: Check Service Status
        run: |
          kubectl get all -n inventory
          kubectl describe svc inventory-frontend -n inventory
          kubectl describe svc inventory-backend -n inventory
