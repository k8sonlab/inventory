name: Push Helm Chart to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'helm/**'
      - '.github/workflows/push-helm-chart.yml'

env:
  REGISTRY: ghcr.io
  CHART_NAME: inventory
  CHART_REPO: ${{ github.repository }}

jobs:
  push-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Log in to Container Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Update Chart version from Git SHA
        run: |
          CHART_VERSION=$(git rev-parse --short HEAD)
          sed -i "s/version: .*/version: ${CHART_VERSION}/" helm/inventory/Chart.yaml
          sed -i "s/appVersion: .*/appVersion: ${CHART_VERSION}/" helm/inventory/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package helm/inventory

      - name: Push chart to GHCR
        run: |
          CHART_FILE=$(ls inventory-*.tgz)
          helm push ${CHART_FILE} oci://${{ env.REGISTRY }}/${{ env.CHART_REPO }}

      - name: Chart digest
        run: |
          echo "Chart pushed to: oci://${{ env.REGISTRY }}/${{ env.CHART_REPO }}/inventory"
          echo "Deploy with: helm upgrade --install inventory oci://${{ env.REGISTRY }}/${{ env.CHART_REPO }}/inventory"
