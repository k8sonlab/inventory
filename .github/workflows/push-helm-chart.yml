name: Push Helm Chart to GHCR

on:
  workflow_run:
    workflows: ["Build and Push Backend Image", "Build and Push Frontend Image"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  CHART_NAME: inventory
  CHART_REPO: k8sonlab

jobs:
  push-chart:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Log in to Container Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Extract version from git tag
        id: version
        run: |
          TAG=$(git describe --tags --exact-match 2>/dev/null || echo "dev")
          VERSION=${TAG#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Chart version: ${VERSION}"

      - name: Update Chart version from Git Tag
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -i "s/version: .*/version: ${VERSION}/" helm/inventory/Chart.yaml
          sed -i "s/appVersion: .*/appVersion: ${VERSION}/" helm/inventory/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package helm/inventory

      - name: Push chart to GHCR
        run: |
          CHART_FILE=$(ls inventory-*.tgz)
          helm push ${CHART_FILE} oci://${{ env.REGISTRY }}/${{ env.CHART_REPO }}

      - name: Chart digest
        run: |
          echo "Chart pushed to: oci://${{ env.REGISTRY }}/${{ env.CHART_REPO }}/inventory"
          echo "Deploy with: helm upgrade --install inventory oci://${{ env.REGISTRY }}/${{ env.CHART_REPO }}/inventory"
