name: Tag Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Squash merges make the PR title the commit subject on main
      - name: Determine next version
        id: version
        run: |
          MSG=$(git log -1 --format=%B "$GITHUB_SHA")
          SUBJECT=$(printf '%s\n' "$MSG" | head -n1)

          if printf '%s\n' "$SUBJECT" | grep -Eq '^[a-z]+(\([^)]+\))?!:' \
            || printf '%s\n' "$MSG" | grep -Eq '^BREAKING[ -]CHANGE'; then
            BUMP=major
          elif printf '%s\n' "$SUBJECT" | grep -Eq '^feat(\([^)]+\))?:'; then
            BUMP=minor
          elif printf '%s\n' "$SUBJECT" | grep -Eq '^(fix|perf)(\([^)]+\))?:'; then
            BUMP=patch
          else
            echo "No release for: $SUBJECT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          LAST=${LAST:-v0.0.0}
          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"

          # Breaking changes only bump minor while below 1.0
          if [ "$BUMP" = "major" ] && [ "$MAJOR" -eq 0 ]; then
            BUMP=minor
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Releasing ${TAG} (${BUMP} bump from ${LAST})"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # Tags created with GITHUB_TOKEN do not trigger workflows, but workflow_dispatch does
      - name: Create release and start the build
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          gh workflow run release.yml --ref "$TAG"
