log_format inventory_access escape=json
  '{"type":"access","timestamp":"$time_iso8601","method":"$request_method",'
  '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration_seconds":$request_time,"remote_address":"$remote_addr"}';

server {
  listen 5174;
  server_name _;
  access_log /dev/stdout inventory_access;
  error_log /dev/stderr warn;
  
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # SPA routing - fallback to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets with caching
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # API proxy to backend
  location /api/ {
    proxy_pass http://inventory-backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Health check endpoint
  location /health {
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }

  # Deny access to dotfiles
  location ~ /\. {
    deny all;
    log_not_found off;
  }

  # Deny access to hidden files
  location ~ ~$ {
    deny all;
    log_not_found off;
  }

  error_page 404 /index.html;
}
